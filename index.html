<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PlayCord</title>
<style>
  :root { --bg: #F4F1EA; --ink: #0C0F15; --muted: #545B66; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141519; --ink: #F3F0EA; --muted: #A8ADB7; } }
  :root[data-theme="dark"] { --bg: #141519; --ink: #F3F0EA; --muted: #A8ADB7; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>PlayCord</h1>
  <p>Christmas lists made in PlayCord open from their own links. If someone sent you one, open the whole link they sent.</p>
</main>
</body>
</html>

<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#141519">
<title>Stop PlayCord’s emails</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- The stop link in PlayCord's emails to people getting a record from a gift list, and in its news (Phil, 28 October
     2026, 18:24 and 18:41). It does nothing until the button is pressed, so a mail program opening links to check them
     can't stop anyone's emails. -->
<style>
  :root { --page: #F5F5F2; --panel: #FFFFFF; --ink: #141519; --muted: #5B606B; --line: #E4E3DF; --gold: #F2B544; --night: #141519; --night-ink: #F3F0EA;
    --display: "Avenir Next Condensed", "AvenirNextCondensed-Heavy", "Bahnschrift", "Roboto Condensed", "sans-serif-condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #141519; --panel: #1C1E24; --ink: #F3F0EA; --muted: #A8ADB7; --line: #2C2F37; } }
  :root[data-theme="dark"] { --page: #141519; --panel: #1C1E24; --ink: #F3F0EA; --muted: #A8ADB7; --line: #2C2F37; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 16px/1.5 var(--body); }
  header { background: var(--night); color: var(--night-ink); padding: 18px 16px; }
  .brand { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 8px; font: 800 1.05rem/1 var(--display); font-stretch: condensed; }
  .brand svg { width: 26px; height: 26px; }
  main { max-width: 560px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font: 800 2.2rem/1 var(--display); font-stretch: condensed; margin: 0 0 12px; }
  p { margin: 0 0 14px; color: var(--muted); }
  button { font: 800 1.08rem/1 var(--display); font-stretch: condensed; border: 0; border-radius: 999px; padding: 14px 22px; min-height: 48px; background: var(--gold); color: #141519; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .done { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; color: var(--ink); }
</style>
</head>
<body>
<header><div class="brand"><svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><circle cx="50" cy="50" r="50" fill="#F7F5F0"/><circle cx="50" cy="50" r="38" fill="#0B0B0D"/><circle cx="50" cy="50" r="15" fill="#F2B544"/><circle cx="50" cy="50" r="3.4" fill="#0B0B0D"/></svg>PlayCord</div></header>
<main id="main">
  <h1 id="h">Stop these emails?</h1>
  <p id="what">PlayCord won’t email you about gifts again: your address is taken off every one it’s on.</p>
  <button type="button" id="go">Stop them</button>
</main>
<script>
(function () {
  'use strict';
  var API = 'https://fyswlovbnndgbipmpquv.supabase.co/functions/v1/api';
  var key = (location.hash || '').replace(/^#/, '');
  var news = /(^|[?&])what=news(&|$)/.test(location.search);
  var main = document.getElementById('main');
  var go = document.getElementById('go');
  if (news) {
    document.title = 'Stop PlayCord’s news';
    document.getElementById('h').textContent = 'Stop PlayCord’s news?';
    document.getElementById('what').textContent = 'You won’t be sent occasional emails about PlayCord any more.';
  }
  function say(title, text) {
    main.textContent = '';
    var h = document.createElement('h1'); h.textContent = title;
    var p = document.createElement('p'); p.className = 'done'; p.textContent = text;
    main.appendChild(h); main.appendChild(p);
  }
  if (!/^[A-Za-z0-9_-]{16,64}$/.test(key)) { say('This link isn’t complete', 'Open the whole link from the email.'); return; }
  go.addEventListener('click', async function () {
    go.disabled = true; go.textContent = 'Stopping…';
    try {
      var res = await fetch(API + '/gift-email-stop', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ key: key, what: news ? 'news' : undefined }) });
      if (!res.ok) throw new Error();
      say('Done', news ? 'No more news from PlayCord. It only starts again if you ask for it and confirm it from your email.' : 'PlayCord won’t email you about gifts again: your address is taken off every one it’s on.');
    } catch (e) {
      go.disabled = false; go.textContent = 'Stop them';
      var p = document.getElementById('what'); if (p) p.textContent = 'PlayCord couldn’t be reached. Try again in a minute.';
    }
  });
})();
</script>
</body>
</html>
